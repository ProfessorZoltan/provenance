# Builds the Windows release on a real Windows runner and attaches it to a GitHub Release.
# Tag a version to publish one:  git tag v0.1.0 && git push origin v0.1.0
name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      arch:
        description: Windows architecture
        type: choice
        default: x64
        options: [x64, arm64, ia32]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Vite 8 devtools peer range breaks npm's resolver, hence --legacy-peer-deps.
      - run: npm ci --legacy-peer-deps

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Package
        run: npm run build && node scripts/pack-win.mjs --${{ inputs.arch || 'x64' }}

      # windows-latest ships NSIS, but pin it down rather than trusting the image.
      - name: Installer
        run: |
          $nsis = "$env:ProgramFiles(x86)\NSIS"
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          $env:PATH = "$env:PATH;C:\Program Files (x86)\NSIS"
          node scripts/make-installer.mjs --${{ inputs.arch || 'x64' }}
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: provenance-windows-${{ inputs.arch || 'x64' }}
          path: |
            build/win/*.zip
            build/win/*-setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/win/*.zip
            build/win/*-setup.exe
          draft: true
          generate_release_notes: true
          body: |
            **`Provenance-<version>-win32-x64-setup.exe`** installs per user — no
            administrator rights, Start Menu entry, and an uninstaller in Add or
            remove programs. **`Provenance-<version>-win32-x64.zip`** is the same
            game as a portable folder: unzip anywhere and run `Provenance.exe`.

            This build is not code-signed, so Windows SmartScreen warns on first
            run: **More info** then **Run anyway**. Saves live in `%APPDATA%\Provenance`
            and survive replacing the folder with a newer one.
